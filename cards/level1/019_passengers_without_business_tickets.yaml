id: 19
title: "Пассажиры без билетов бизнес-класса"
task: |
  Выведи имена пассажиров, которые ни разу не летали местом
  класса 'business'.
answer: "SELECT Passenger.name FROM Passenger LEFT JOIN Pass_in_trip ON Passenger.id = Pass_in_trip.passenger AND Pass_in_trip.class = 'business' WHERE Pass_in_trip.id IS NULL;"
