id: 28
title: "Выручка по компаниям и классам"
task: |
  Для каждой пары «авиакомпания — класс обслуживания» посчитай
  выручку и выведи только пары, где она больше 30000. Столбцы
  назови company_name, class и revenue.
answer: "SELECT Company.name AS company_name, Pass_in_trip.class AS class, SUM(Pass_in_trip.price) AS revenue FROM Company JOIN Trip ON Trip.company = Company.id JOIN Pass_in_trip ON Pass_in_trip.trip = Trip.id GROUP BY Company.id, Company.name, Pass_in_trip.class HAVING SUM(Pass_in_trip.price) > 30000;"
