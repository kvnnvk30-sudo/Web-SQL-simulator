id: 37
title: "Пассажиры в обоих классах"
task: |
  Выведи имена пассажиров, которые хотя бы раз летели бизнес-
  классом и хотя бы раз эконом-классом.
answer: "SELECT name FROM Passenger p WHERE EXISTS (SELECT 1 FROM Pass_in_trip WHERE passenger = p.id AND class = 'business') AND EXISTS (SELECT 1 FROM Pass_in_trip WHERE passenger = p.id AND class = 'economy');"
