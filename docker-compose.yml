services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${DB_NAME:-sql_trainer}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    # Без volume: схема и данные пересоздаются приложением при каждом старте
    # (init_db: DROP + CREATE + INSERT из schema/database.sql).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Внутри сети compose хост Postgres — имя сервиса, а не localhost.
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-sql_trainer}
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "${APP_PORT:-5000}:5000"
